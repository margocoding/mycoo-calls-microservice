name: Calls CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build Test Security Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
      - name: Dependency Audit
        run: npm audit --audit-level=high
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: mycoo-calls:test
          load: true
      - name: Container smoke test
        run: |
          docker run -d --name calls -p 8000:8000 -e CALLS_SERVICE_SECRET="$(openssl rand -hex 32)" mycoo-calls:test
          trap 'docker logs calls; docker rm -f calls' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: mycoo-calls:test
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
